# Workflow de CI — Lint, typecheck, tests y build en PRs
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://emedoteme:emedoteme@localhost:5432/emedoteme
  DIRECT_URL: postgresql://emedoteme:emedoteme@localhost:5432/emedoteme

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: emedoteme
          POSTGRES_PASSWORD: emedoteme
          POSTGRES_DB: emedoteme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emedoteme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
